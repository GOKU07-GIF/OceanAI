name: Copernicus data smoke acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

jobs:
  copernicus-smoke:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Copernicus tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate request builder
        run: |
          python scripts/python/download_copernicus_subset.py --dataset waves --dry-run
          python scripts/python/download_copernicus_subset.py --dataset physics --dry-run
          python scripts/python/download_copernicus_subset.py --dataset currents --dry-run
          python scripts/python/download_copernicus_subset.py --dataset bgc --dry-run

      - name: Calculate rolling 24-hour window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          start = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          end = start + timedelta(days=1)
          print(f"start={start:%Y-%m-%dT%H:%M:%S}")
          print(f"end={end:%Y-%m-%dT%H:%M:%S}")
          PY

      - name: Acquire Copernicus waves
        if: ${{ env.COPERNICUSMARINE_SERVICE_USERNAME != '' && env.COPERNICUSMARINE_SERVICE_PASSWORD != '' }}
        continue-on-error: true
        run: |
          python scripts/python/download_copernicus_subset.py \
            --dataset waves \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --min-lon 68 --max-lon 78 --min-lat 8 --max-lat 24 \
            --output-dir datasets/raw/copernicus

      - name: Acquire Copernicus physics
        if: ${{ env.COPERNICUSMARINE_SERVICE_USERNAME != '' && env.COPERNICUSMARINE_SERVICE_PASSWORD != '' }}
        continue-on-error: true
        run: |
          python scripts/python/download_copernicus_subset.py \
            --dataset physics \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --min-lon 68 --max-lon 78 --min-lat 8 --max-lat 24 \
            --output-dir datasets/raw/copernicus

      - name: Acquire Copernicus currents
        if: ${{ env.COPERNICUSMARINE_SERVICE_USERNAME != '' && env.COPERNICUSMARINE_SERVICE_PASSWORD != '' }}
        continue-on-error: true
        run: |
          python scripts/python/download_copernicus_subset.py \
            --dataset currents \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --min-lon 68 --max-lon 78 --min-lat 8 --max-lat 24 \
            --output-dir datasets/raw/copernicus

      - name: Acquire Copernicus chlorophyll
        if: ${{ env.COPERNICUSMARINE_SERVICE_USERNAME != '' && env.COPERNICUSMARINE_SERVICE_PASSWORD != '' }}
        continue-on-error: true
        run: |
          python scripts/python/download_copernicus_subset.py \
            --dataset bgc \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --min-lon 68 --max-lon 78 --min-lat 8 --max-lat 24 \
            --output-dir datasets/raw/copernicus

      - name: Build normalized data manifest
        if: always()
        run: |
          python scripts/python/build_data_manifest.py \
            datasets/raw/copernicus \
            --output datasets/raw/copernicus/manifest.json

      - name: Report acquired files
        if: always()
        run: |
          echo "Acquisition directory:"
          find datasets/raw/copernicus -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true

      - name: Upload Copernicus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-smoke-data
          path: datasets/raw/copernicus/
          if-no-files-found: warn
          retention-days: 7
